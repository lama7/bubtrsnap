[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bubtrsnap"
description = "btrfs snapshot and backup tool (single-file, stdlib-only)"
readme = "README.md"
requires-python = ">=3.10"
# Single source of truth for the version string: VERSION in bubtrsnap.py.
dynamic = ["version"]
license = { file = "LICENSE", expression = "MIT" }
authors = [
    { name = "Gerry" },
]
keywords = ["btrfs", "backup", "snapshot", "send", "receive", "rsync"]
classifiers = [
    "Environment :: CLI / End User",
    "Intended Audience :: Developers",
    "Intended Audience :: Systems Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: File Systems",
]

[project.urls]
homepage = "https://github.com/lama7/bubtrsnap"

[project.scripts]
bubtrsnap = "bubtrsnap:main"

[tool.setuptools]
py-modules = ["bubtrsnap"]
# Dynamic version (PEP 621 / setuptools): read from VERSION in bubtrsnap.py.
dynamic = { version = { attr = "bubtrsnap.VERSION" } }
